<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f1115" />
  <title>Roamint — offline</title>
  <style>
    :root { --bg: #0f1115; --surface: #171a21; --text: #e8eaed; --muted: #9aa3b2; --accent: #5b8cff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center;
    }
    .card { max-width: 320px; }
    .icon { font-size: 48px; line-height: 1; margin-bottom: 16px; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { color: var(--muted); font-size: 15px; line-height: 1.5; margin-bottom: 20px; }
    button {
      font: inherit; font-weight: 600; color: #fff; background: var(--accent);
      border: 0; border-radius: 10px; padding: 12px 20px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>No internet connectivity</h1>
    <p>Roamint needs a live connection to your server. Reconnect to your network (or Tailscale) and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
